name = "murmur"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Keep the workers.dev observation URL alive alongside the custom domains (24-48h canary window).
workers_dev = true

# ============================================================================
# v1.4 SELF-HOSTING SAFE BASELINE (二次开发 · 安全审计整改版)
# ----------------------------------------------------------------------------
# This file ships the SAFE defaults from the security audit (F-1/F-2):
#   · the agent economy runs the KEYLESS SIMULATOR (no mnemonic, no broadcast)
#   · every real-money rail is OFF until YOU arm it explicitly, step by step
#   · all upstream-owned bindings (domain route, D1 id, deployed contracts)
#     are removed — you must plug in YOUR OWN resources (marked ①②③ below)
# Arming sequence (do NOT skip steps): deploy → verify → set ADMIN_TOKEN (④)
#   → create D1 (②) → optional: onchain + shadow → real spend (see §9 doc).
# Secrets are NEVER written here — `wrangler secret put <NAME>` only.
# ============================================================================

# ① CUSTOM DOMAIN — FLYX402.XYZ（zone active 于本账户，DNS+SSL 由 Cloudflare 自动供给）。
#    整站单地址绑定：apex + www 都路由到本 Worker（同源 UI+API）。回滚 = 注释掉本块再 deploy。
routes = [
  { pattern = "flyx402.xyz", custom_domain = true },
  { pattern = "www.flyx402.xyz", custom_domain = true }
]

# ---------- Static frontend (Workers Assets — same-origin single-URL deployment) ----------
# Serves packages/frontend/public straight from THIS worker: "/" → index.html, plus app.js /
# styles.css / i18n-* / developers.html / community.html. Asset (GET/HEAD) requests are free and
# never invoke the script; every other path (/api/*, /state, /arena, POSTs, …) runs the Worker,
# whose router strips the same-origin "/api" prefix (see src/index.ts). One URL = UI + API, zero
# CORS config, no separate Pages project. Rollback = delete this block and deploy the frontend
# separately (packages/frontend: `wrangler pages deploy public`).
[assets]
directory = "../frontend/public"

# Cron: observe Arc, update the market temperature and let the fly population react — every minute
# (Cloudflare's minimum cron granularity). Each run reads whole-chain activity and advances the sim.
[triggers]
crons = ["* * * * *"]

# ---------- Variables (non-sensitive, committed with the code) ----------
# SAFE PHASE — the swarm runs fully keyless: the economy is the internal SIMULATED ledger, the
# prediction market and arena are OFF, and ECONOMY_REAL_SPEND defaults to "false" in code (v1.4).
# With NO mnemonic set, a fresh deployment can never move a single wei of real money.
# Secrets (set with `wrangler secret put`, NEVER committed): see ④⑤ below.
[vars]
# ===== Arc chain =====
CHAIN_ID = "5042"                             # 5042 = Arc mainnet · 5042002 = Arc testnet
RPC_URL = "https://rpc.mainnet.arc.io"        # Arc mainnet public RPC (KEEP keyed/private endpoints
                                              # out of this var — /state exposes it; use the
                                              # ALCHEMY_ARC_RPC_URL *secret* for paid endpoints)

# ===== Market temperature (Arc whole-chain activity) =====
MARKET_SAMPLE_BLOCKS = "16"                   # recent blocks sampled per cron for tx/gas throughput
MARKET_EWMA_ALPHA = "0.08"                    # baseline smoothing (slow ⇒ tracks the regime, not spikes)
MARKET_GAIN = "3.0"                           # logistic sharpness ratio→temperature (calibrated on live Arc)
REGIME_HOT = "0.66"                           # temperature ≥ this ⇒ HOT
REGIME_COLD = "0.33"                          # temperature ≤ this ⇒ COLD

# ===== Fly population =====
POPULATION_SIZE = "24"                        # number of flies in the swarm (1–256)
POPULATION_SEED_BASE = "42"                   # base seed; fly i uses seed = base + i*7919
TICKS_PER_CRON = "6"                          # simulation sub-ticks per cron
SIM_STEPS_PER_TICK = "500"                    # total LIF integration steps per cron, split across sub-ticks
# Swarm sharding (see swarm.ts / shard.ts). "1" = the original single-DO swarm — every brain in FlyStateDO,
# the FLY_SHARD binding inert (ZERO shards). "12" fans the HEAVY per-fly LIF advance out to 12 FlyShardDO
# isolates (2 flies each at POPULATION_SIZE=24), each with its own 128 MB + CPU budget and its own SQLite.
# Rollback = set this back to "1".
SHARD_COUNT = "12"

# ===== Visitor stimulus ("poke the swarm") + CORS (audit F-5/F-6 hardening) =====
STIMULUS_COOLDOWN_SEC = "30"                  # one injection per visitor per N seconds
# STIMULUS_ADMIN_ONLY = "true"                # recommended on PUBLIC self-hosts: POST /stimulus then
#                                             # requires ADMIN_TOKEN (otherwise anonymous visitors can
#                                             # shape the swarm's neural state — audit F-5). Default false.
FRONTEND_ORIGIN = "*"                         # informational default; see CORS_ALLOW_ORIGINS below
# CORS_ALLOW_ORIGINS = "https://www.your-domain.com,https://your-domain.com"
#                                             # recommended: when set, ONLY these Origins get an
#                                             # Access-Control-Allow-Origin header (audit F-6).
#                                             # Unset = legacy behaviour (reflect any request Origin).

# ===== Ultimate admin authority (终极管理权限) =====
# The deployment's declared ULTIMATE-ADMIN wallet address. Exposed read-only via /state
# (config.adminWallet) and shown as the "admin" row in the frontend economy panel with a one-click
# explorer link — anyone can verify the declared authority on-chain. This is an IDENTITY/OWNERSHIP
# declaration: it does NOT hold keys and never signs; the gas/signing facilitator remains the
# HD-derived wallet from the ECONOMY_MNEMONIC secret. To transfer ultimate authority, change this
# address and redeploy.
ADMIN_WALLET = "0x10687368eF1be3f178de0fCCf5EdfF49e1C258B1"

# ===== Agent economy (x402 micropayments between fly agents) =====
# SAFE BASELINE (v1.4, audit F-1): the economy runs the keyless SIMULATED ledger — every wallet,
# deal and price exists, but no chain call is ever made and no key is ever held.
# ARMING (later, deliberately): set ECONOMY_FACILITATOR = "onchain" + provide ECONOMY_MNEMONIC (④),
# keep ECONOMY_SHADOW = "true" first (sign + eth_call, zero broadcast), verify, and only then
# explicitly set ECONOMY_REAL_SPEND = "true" (the code default is now "false" — nothing moves
# without this line).
ECONOMY_ENABLED = "true"                      # agent economy on/off (off ⇒ pure reactive population)
ECONOMY_INITIAL_BALANCE = "6"                 # starting USDC per agent wallet (simulated ledger)
ECONOMY_BASE_PRICE = "0.002"                  # base price of one good (USDC) before neural/market scaling
ECONOMY_SOLVENCY_FLOOR = "0.5"                # simulated treasury tops an agent up to this when it runs dry
ECONOMY_MAX_DEALS = "10"                      # per-CRON settlement budget, spread across the 6 sub-ticks
ECONOMY_FACILITATOR = "simulated"             # "simulated" (SAFE; keyless ledger) | "onchain" (real EIP-3009; needs ④)

# ===== Real-money (ONCHAIN) settlement rails — ALL INERT in the safe baseline =====
# SECRETS — set with `wrangler secret put <NAME>`, NEVER written into this file:
#   ECONOMY_MNEMONIC        one BIP-39 seed → HD-derives all agent wallets (m/44'/60'/0'/0/{id}) + gas wallet
#   ECONOMY_FACILITATOR_PK  optional dedicated gas-wallet key (else the gas wallet is derived from the seed)
#   ALCHEMY_ARC_RPC_URL     complete private Alchemy Arc mainnet HTTPS endpoint (paid RPC; NEVER put it
#                           in RPC_URL above — /state publishes that one)
#   ADMIN_TOKEN             ④ REQUIRED on any public deployment: locks POST /tick + /reset (+ /stimulus
#                           when STIMULUS_ADMIN_ONLY="true") behind the x-admin-token header / ?token=
# Rails (all committed vars are safe to publish):
ECONOMY_REAL_SPEND = "false"                  # KILL SWITCH (code default "false"): flip to "true" ONLY after
                                              # the shadow run is clean — this is the last arming step
ECONOMY_SHADOW = "true"                       # "true" = sign + eth_call each transfer but broadcast nothing;
                                              # set "false" only together with REAL_SPEND="true" when going live
ECONOMY_DAILY_CAP = "20"                      # global real-spend ceiling per UTC day (USDC); 0 = no cap
ECONOMY_PER_AGENT_DAILY_CAP = "2"             # per-agent real-spend ceiling per UTC day (USDC); 0 = no cap
# ECONOMY_MAX_DEAL = "0.05"                   # facilitator hard per-deal ceiling (USDC)
# ECONOMY_GAS_PRICE_GWEI = "20"               # pin relay gas (Arc launched ~20 gwei); omit = let viem estimate
# ECONOMY_USDC_EIP712_NAME = "USDC"           # EIP-712 domain name (probe: name()="USDC"); tune if signatures revert
# ECONOMY_USDC_EIP712_VERSION = "2"           # EIP-712 domain version (probe: version()="2")

# ===== Settlement NETTING (ONCHAIN ONLY — gas amortisation) =====
# Trades no longer broadcast one tx per micropay: each pair's signed net accumulates in the DO and is
# flushed at most once per cron, only when |net| ≥ MIN_BROADCAST or the net has aged ≥ FLUSH_TICKS
# sub-ticks. Reciprocal trades cancel (net=0 ⇒ zero tx), dust carries forward, and nets above
# ECONOMY_MAX_DEAL split into chunks. The internal ledger/volume/caps move ONLY on a mined receipt,
# so a failed flush never invents money. Inert in simulated mode.
ECONOMY_NET_MIN_BROADCAST = "0.004"           # min |net| (USDC) before a pair is broadcast
ECONOMY_NET_FLUSH_TICKS = "30"                # force-flush any nonzero pending net at least every N sub-ticks (0 = never force)

# ===== Neural-receipt REGISTRY (ONCHAIN ONLY — trustless chain head) =====
# ② YOUR OWN CONTRACT REQUIRED. Deploy contracts/NeuralReceiptRegistry.sol (see contracts/README.md)
#    from YOUR wallet with YOUR facilitator as committer, then paste its address below. Deploying with
#    the line commented is fully supported: the commit step is skipped entirely (zero behaviour change).
ECONOMY_REGISTRY_ADDRESS = "0x87F6a942bb563dd7Bba4d3CdbD5d51477E71fc34"   # R3 本部署 NeuralReceiptRegistry（committer=facilitator，R4-0 接线 2026-09-23）

# ===== Circle Facilitator Service (the OFFICIAL hosted x402 facilitator — src/circle.ts) =====
# Circle's relayer screens both parties, submits the buyer's EIP-3009 USDC transfer and pays the
# settlement gas. SAFE BASELINE: "off" (self-broadcast path, no external dependency). When you arm
# onchain you may flip to "external" (Arc Pulse seller side only) — the keyless trial is rate-limited
# per payTo and returns 403 registration_required once exhausted; for sustained volume add CIRCLE_API_KEY
# (secret) so auth switches to Bearer. Rollback = back to "off" and redeploy.
# FREE-TIER 64-VAR BUDGET: ECONOMY_CIRCLE_FACILITATOR / CIRCLE_FACILITATOR_URL / CIRCLE_MAX_TIMEOUT_SECONDS
# are NOT pinned here — code defaults ("off" / https://api.circle.com / 12) are byte-identical to the
# previous explicit pins (src/config.ts L695-698). Re-pin via --var only when deviating.
# FREE-TIER 64-VAR BUDGET: ECONOMY_CIRCLE_FACILITATOR/CIRCLE_FACILITATOR_URL/CIRCLE_MAX_TIMEOUT_SECONDS
# are NOT pinned here — their code defaults ("off" / https://api.circle.com / 12) are byte-identical
# to the previous explicit pins (src/config.ts L695-698). Re-pin via --var only when deviating.
# SECRET (optional) — set with `wrangler secret put CIRCLE_API_KEY`, NEVER written here.

# ===== Prediction market (ONCHAIN — neural-staked temperature bets) =====
# Each cron the swarm stakes real USDC on whether next tick's market temperature rises or falls; the
# following cron resolves it parimutuel (strictly zero-sum) and folds the net PnL through the SAME
# netting / EIP-3009 / registry path as every other settlement. SAFE BASELINE: "false" (audit F-1).
PREDICT_ENABLED = "true"                      # 影子期开启：simulated 账本下蝇群以模拟 USDC 下注（不碰真钱，无 registry 时 commit 自动跳过/失败即 warn）；实盘仍需 onchain facilitator 军旗
PREDICT_STAKE_USDC = "0.002"                  # base stake per bet (USDC), scaled by arousal (0.4 + 0.6·arousal)
PREDICT_MAX_STAKE_USDC = "0.01"               # hard per-bet ceiling (USDC); each bet is also capped at balance/4
PREDICT_FLAT_BAND = "0.008"                   # |Δtemperature| ≤ this ⇒ FLAT: full refund, no flows, not committed
PREDICT_COMMIT = "true"                       # commit decisive resolutions to the on-chain NeuralReceiptRegistry

# ===== Human-vs-swarm prediction ARENA (ONCHAIN — MURMUR-denominated, NON-CUSTODIAL) =====
# Holders bet MURMUR on the SAME Arc-temperature move the fly swarm does. Bets are escrowed in a
# deployed PredictionArena contract and paid out parimutuel BY the contract; the Worker is only the
# authorized RESOLVER (its facilitator wallet calls openRound/resolve). ② YOUR OWN CONTRACT REQUIRED:
# deploy contracts/PredictionArena.sol from YOUR account (resolver = YOUR facilitator), then set
# ARENA_ADDRESS + ARENA_TOKEN and flip ARENA_ENABLED. Left OFF here — deploying with upstream's
# contract addresses would make your Worker call contracts it has no authority over (audit F-2).
ARENA_ENABLED = "true"                        # R4-1 开旗（2026-09-23）：读路径立即生效；开轮/结算写路径还需 onchain facilitator + REAL_SPEND（本地已武装，云端待用户 secret 布防）
ARENA_ADDRESS = "0x0243F95C2654C888a36B7B0DE1D200AaF7C16B60"   # R3 本部署 PredictionArena (Arc mainnet 5042, resolver=facilitator)
ARENA_TOKEN = "0x43D84EfE7174637cdA55Ae1560cd4BFf4BaAB490"     # R3 本部署 MURMUR（100% 供应在 ADMIN treasury，零流通时开轮空转无害）
ARENA_ROUND_MIN = "60"                        # minutes per round (== the betting window); clamped 1..1440
# FREE-TIER 64-VAR BUDGET: ARENA_FLAT_BAND / ARENA_STALE_GRACE_SEC not pinned — code defaults
# ("0.008" via PREDICT_FLAT_BAND fallback / "259200"; src/config.ts L800-801) byte-identical. Re-pin via --var only.

# ===== Paid data product resource (audit F-3 fix) =====
# GET /signal/pulse + /signal/requirements advertise WHICH resource a buyer is paying for. v1.4 derives
# it from the incoming request origin automatically (a self-host naturally advertises its own domain).
# Set this only to override it explicitly:
# SIGNAL_RESOURCE = "https://api.your-domain.com/signal/pulse"
# SIGNAL_PAYTO — the revenue address for the paid signal (x402 seller side). sovereignty: ALWAYS set
# this explicitly on a self-host — when unset it falls back to the HD-derived gas wallet from YOUR
# mnemonic (still yours, but implicit). Explicit = every x402 buyer signature is validated against
# exactly this address (auth.to !== payTo ⇒ rejected), so revenue can only ever land here.
SIGNAL_PAYTO = "0x10687368eF1be3f178de0fCCf5EdfF49e1C258B1"

# ===== Connectome sizing — 10x (10,800 neurons/fly): 1800 + 4000 + 4000 + 400 + 120×5 motor = 10,800 =====
# DENSITY drops 0.02 → 0.002 to hold fan-in linear, so each brain fits 2 flies/shard under 128 MB and
# ~1.4 MB serialised under the 2 MB value cap (hence SHARD_COUNT = 12 above). Rollback = SHARD_COUNT="1"
# + the 1,080-neuron defaults below.
BRAIN_N_SENSORY = "1800"
BRAIN_N_INTER_L1 = "4000"
BRAIN_N_INTER_L2 = "4000"
BRAIN_N_MODULATORY = "400"
BRAIN_N_MOTOR_PER_CHANNEL = "120"
BRAIN_DENSITY = "0.002"

# ===== Meme monitoring + external execution (二次开发 optional layer — SHIPPED OFF, zero behaviour change) =====
# The meme channel is a parallel temperature input (multi-chain meme launch heat / volume spikes /
# holder concentration / smart-money flow / social momentum); the execution layer turns the swarm's
# intent read-out into third-party DEX trades behind HARD risk rails. Both default OFF and both are
# fail-soft. ROLLOUT (from the 二次开发 doc): monitoring first, then shadow paper-trading, then — only
# after a 24–48h clean shadow run with MAX_PER_TRADE_USDC=1–2 — consider flipping EXECUTION_REAL_SPEND.
# SECRETS (wrangler secret put, NEVER here): SOLANA_PRIVATE_KEY, SOLANA_RPC_URL, JUPITER_API_KEY,
# EVM_PRIVATE_KEY, BASE_RPC_URL, ETH_RPC_URL, ZEROX_API_KEY. The execution wallet MUST stay separate
# from the internal x402 economy wallets (fund isolation).
# FREE-TIER 64-VAR BUDGET: MEME_ENABLED/MEME_WEIGHT not pinned — code defaults (false / 0.35)
# byte-identical to previous pins (src/config.ts L136-137). Re-pin via --var when arming the meme channel.
# MEME_RUG_CONCENTRATION = "0.45"             # holder concentration ⇒ RUG_RISK override
# FREE-TIER 64-VAR BUDGET: MEME_ENABLED / MEME_WEIGHT not pinned — code defaults (false / 0.35)
